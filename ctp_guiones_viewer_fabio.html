<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTP · Guiones Fabio Hoyos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

:root {
  --navy:        #0F2544;
  --navy-light:  #1a3560;
  --navy-dark:   #091a33;
  --lime:        #00C96E;
  --lime-dim:    #00a85c;
  --lime-soft:   rgba(0,201,110,0.12);
  --lime-softer: rgba(0,201,110,0.06);

  --white:        #ffffff;
  --text-primary: #e8edf4;
  --text-secondary:#8fa3bf;
  --text-muted:   #5a7494;

  --border:       rgba(255,255,255,0.08);
  --border-lime:  rgba(0,201,110,0.3);

  --card-bg:    rgba(255,255,255,0.04);
  --card-hover: rgba(255,255,255,0.07);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--navy-dark);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
}

.header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(9,26,51,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.brand-dot {
  width: 8px; height: 8px;
  background: var(--lime);
  border-radius: 50%;
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.6; transform: scale(0.85); }
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-name { font-weight: 600; font-size: 14px; color: var(--white); }
.brand-handle { font-size: 11px; color: var(--text-muted); }
.counter { font-size: 12px; color: var(--text-secondary); }
.counter b { color: var(--lime); font-weight: 600; }

.progress-bar  { height: 2px; background: var(--border); }
.progress-fill { height: 100%; background: var(--lime); transition: width 0.4s ease; }

.main { max-width: 760px; margin: 0 auto; padding: 32px 24px 60px; }

.meta { margin-bottom: 20px; animation: fadeUp 0.4s ease forwards; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.numero { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--lime); text-transform: uppercase; margin-bottom: 8px; }
.reel-title { font-size: 24px; font-weight: 600; color: var(--white); margin: 0 0 14px 0; line-height: 1.25; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 20px; }
.tag-bloque  { background: rgba(127,119,221,0.15); color: #a8a1f0; border: 1px solid rgba(127,119,221,0.25); }
.tag-tipo    { background: var(--lime-softer); color: var(--lime); border: 1px solid var(--border-lime); }
.tag-palanca { background: rgba(255,255,255,0.06); color: var(--text-secondary); border: 1px solid var(--border); }
.tag-duracion{ background: rgba(255,255,255,0.06); color: var(--text-secondary); border: 1px solid var(--border); }
.tag-presentador { background: rgba(240,180,41,0.12); color: #f0b429; border: 1px solid rgba(240,180,41,0.3); }

.tabs { display: flex; gap: 4px; margin: 24px 0 20px; border-bottom: 1px solid var(--border); }
.tab {
  padding: 10px 18px; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.2s;
  background: none; border-top: none; border-left: none; border-right: none;
  font-family: 'Inter', sans-serif;
}
.tab:hover { color: var(--white); }
.tab.active { color: var(--lime); border-bottom-color: var(--lime); }

.tab-content { display: none; animation: fadeUp 0.35s ease forwards; }
.tab-content.active { display: block; }

.script-block { margin-bottom: 18px; }
.script-label { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.script-timing { font-size: 11px; font-weight: 400; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
.label-gancho     { color: #a8a1f0; }
.label-relevancia { color: var(--lime); }
.label-valor      { color: #f0b429; }
.label-accion     { color: #f08070; }
.script-text {
  background: var(--card-bg);
  border-left: 3px solid var(--text-muted);
  border-radius: 6px;
  padding: 14px 16px;
  font-size: 15px; line-height: 1.6;
  color: var(--text-primary);
}
.script-text.gancho     { border-left-color: #7F77DD; }
.script-text.relevancia { border-left-color: #00C96E; }
.script-text.valor      { border-left-color: #f0b429; }
.script-text.accion     { border-left-color: #f08070; }

.notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.note-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
}
.note-card .note-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.note-card .note-icon { font-size: 16px; }
.note-card .note-title { font-size: 12px; font-weight: 600; color: var(--white); }
.note-card .note-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.cta-note {
  grid-column: 1 / -1;
  background: var(--lime-softer);
  border-color: var(--border-lime);
}
.cta-note .note-title { color: var(--lime); }
.warn-note {
  grid-column: 1 / -1;
  background: rgba(240,180,41,0.08);
  border-color: rgba(240,180,41,0.35);
}
.warn-note .note-title { color: #f0b429; }

.desc-box {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
}
.desc-copy-btn {
  position: absolute; top: 16px; right: 16px;
  background: var(--lime-soft);
  border: 1px solid var(--border-lime);
  color: var(--lime);
  font-size: 11px; font-weight: 600;
  padding: 6px 14px; border-radius: 20px;
  cursor: pointer;
  transition: background 0.2s;
  font-family: 'Inter', sans-serif;
}
.desc-copy-btn:hover { background: rgba(0,201,110,0.2); }
.desc-text { font-size: 14px; line-height: 1.7; color: var(--text-primary); white-space: pre-line; margin-bottom: 16px; padding-right: 90px; }
.hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
.hashtag {
  font-size: 12px; color: var(--lime);
  background: var(--lime-softer);
  padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--border-lime);
}

.nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 32px; }
.nav-btn {
  padding: 12px 24px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text-secondary);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}
.nav-btn:hover:not(:disabled) { background: var(--card-hover); color: var(--white); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.next {
  background: var(--lime); border-color: var(--lime); color: var(--navy-dark); font-weight: 600;
}
.nav-btn.next:hover:not(:disabled) { background: var(--lime-dim); border-color: var(--lime-dim); }

.dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 320px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); cursor: pointer; transition: all 0.2s; border: none; padding: 0; }
.dot.active { background: var(--lime); width: 20px; border-radius: 3px; }

@media (max-width: 600px) {
  .header { padding: 16px 20px; }
  .main   { padding: 28px 16px 60px; }
  .reel-title { font-size: 19px; }
  .notes-grid { grid-template-columns: 1fr; }
  .cta-note, .warn-note { grid-column: 1; }
  .tab        { padding: 10px 14px; font-size: 12px; }
  .desc-text  { padding-right: 0; }
  .desc-copy-btn { position: static; display: inline-block; margin-bottom: 12px; }
  .nav-row { flex-wrap: wrap; gap: 14px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="brand-dot"></div>
    <div class="brand-text">
      <div class="brand-name">Conquista Tu Patrimonio</div>
      <div class="brand-handle">Presentador: Fabio Hoyos (tuteo)</div>
    </div>
  </div>
  <div class="counter">Guión <b id="counter-current">1</b> de <span id="counter-total">11</span></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

<div class="main">
  <div class="meta" id="meta">
    <div class="numero" id="f-numero"></div>
    <h1 class="reel-title" id="f-titulo"></h1>
    <div class="tags">
      <span class="tag tag-presentador">🎙️ Fabio Hoyos</span>
      <span class="tag tag-bloque" id="f-bloque"></span>
      <span class="tag tag-tipo" id="f-tipo"></span>
      <span class="tag tag-palanca" id="f-palanca"></span>
      <span class="tag tag-duracion" id="f-duracion"></span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="guion" onclick="switchTab('guion')">Guión</button>
    <button class="tab" data-tab="notas" onclick="switchTab('notas')">Notas de grabación</button>
    <button class="tab" data-tab="descripcion" onclick="switchTab('descripcion')">Descripción del post</button>
  </div>

  <div class="tab-content active" id="tab-guion"></div>
  <div class="tab-content" id="tab-notas"></div>
  <div class="tab-content" id="tab-descripcion"></div>

  <div class="nav-row">
    <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← Anterior</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn next" id="btn-next" onclick="navigate(1)">Siguiente →</button>
  </div>
</div>

<script>
const reels = [
{
  numero: "Guión 01 · Embudo 1", titulo: "La Verdad Sobre la Suerte",
  bloque: "🧠 Mentalidad", tipo: "Reflexión Directa · versión larga",
  palanca: "Reencuadre de creencia (la suerte es la excusa cómoda para no actuar)", duracion: "~90 seg",
  guion: [
    { parte: "Gancho", timing: "~8 seg", clase: "gancho", texto: "La gente ve a alguien viviendo de una propiedad y dice 'qué suerte'. Tú también lo pensaste alguna vez. Te voy a contar la verdad de eso." },
    { parte: "Relevancia", timing: "~14 seg", clase: "relevancia", texto: "Hablemos claro: la palabra 'suerte' es la excusa perfecta para no tener que cambiar nada. Si es suerte, no depende de ti. Y ahí es donde mucha gente se queda cómoda toda la vida, esperando que le toque." },
    { parte: "Valor", timing: "~55 seg", clase: "valor", texto: "Lo que la gente ve es el resultado: una casa convertida en coliving, dejando plata todos los meses. Lo que no ve es todo lo que pasó antes. No ve las semanas que esa persona pasó buscando propiedad, ni las que descartó porque no servían. No ve que tuvo que aprender a diferenciar una casa que sí es negocio de una que no. No ve las noches que dudó si arrancar o esperar un mes más. No ve que muchos empezaron con Rent to Rent, con poquito capital, solo para entender cómo funciona el negocio antes de dar el salto a comprar con Flipping 2.0. Lo que ves publicado es el mes doce, cuando ya todo funciona. Lo que no ves es el mes uno, el dos, el tres, cuando esa persona no tenía ni idea de si esto le iba a funcionar, y decidió seguir de todas formas. La suerte no construye eso. La decisión de empezar, sí." },
    { parte: "Acción", timing: "~10 seg", clase: "accion", texto: "La próxima vez que veas a alguien viviendo de una propiedad, no pienses 'qué suerte'. Piensa 'qué decidió hacer distinto'. Sígueme, te sigo enseñando cómo se construye eso paso a paso." }
  ],
  notas: [
    { icon: "⚡", titulo: "Ritmo y energía", texto: "Reflexivo, con un pequeño quiebre de ritmo en \"y ahí es donde mucha gente se queda cómoda\". En el bloque largo del Valor, variar la cadencia: más lento en las frases \"no ve...\", más firme en \"la suerte no construye eso\".", cta: false },
    { icon: "😐", titulo: "Expresión", texto: "Empática y honesta, sin sonar a sermón — es una observación, no un regaño.", cta: false },
    { icon: "🤲", titulo: "Gestos", texto: "Gesto de \"cortina\" (mano tapando/descubriendo) cada vez que dice \"no ve\" — como revelando lo que está detrás del resultado visible.", cta: false },
    { icon: "🎬", titulo: "Visuales sugeridos", texto: "Talking head con cortes sutiles de plano (medio → cerrado). Overlay opcional: \"Lo que ves: mes 12\" / \"Lo que no ves: mes 1, 2, 3\".", cta: false },
    { icon: "🎵", titulo: "Audio", texto: "Track reflexivo y constante, sin subir mucho — el peso está en las pausas, no en la música.", cta: false },
    { icon: "📢", titulo: "CTA", texto: "Verbal + texto en pantalla: \"Sígueme, te sigo enseñando paso a paso\".", cta: true }
  ],
  descripcion: "La gente ve a alguien viviendo de una propiedad y dice \"qué suerte\". Pero nadie ve lo que pasó antes.\n\nNo ves las semanas buscando la propiedad correcta. No ves las dudas del mes uno, dos, tres. No ves que muchos empezaron con poquito capital, solo para aprender el negocio antes de dar el salto grande.\n\nLa suerte no construye eso. La decisión de empezar, sí.\n\n👉 Sígueme, te sigo enseñando cómo se construye eso paso a paso.",
  hashtags: ["#ConquistaTuPatrimonio","#LibertadFinanciera","#MentalidadDeInversor","#InversionInmobiliaria","#BienesRaicesColombia"]
},
{
  numero: "Guión 02 · Embudo 1", titulo: "El Costo de No Invertir Ahora",
  bloque: "🧠 Mentalidad", tipo: "Reflexión Directa · #8",
  palanca: "Costo de oportunidad (el precio de no actuar, en números simples)", duracion: "48–56 seg",
  guion: [
    { parte: "Gancho", timing: "~6 seg", clase: "gancho", texto: "Postergar tu primera propiedad un año más no es gratis. Te muestro cuánto te está costando de verdad esperar." },
    { parte: "Relevancia", timing: "~9 seg", clase: "relevancia", texto: "La gente piensa que 'esperar' no cuesta nada, porque no ve la plata salir de su bolsillo. Pero sí sale — solo que sale de la que pudiste haber tenido entrando." },
    { parte: "Valor", timing: "~26 seg", clase: "valor", texto: "Si hoy tienes una propiedad convertida en coliving dejándote $6 millones al mes, y decides esperar un año más para empezar, ese año que esperaste te costó $72 millones que pudiste haber recibido y no recibiste. No es que pierdas plata de tu bolsillo — es que dejas de recibir la que ya podías estar recibiendo. Y ese año no vuelve: no hay forma de recuperar esos $72 millones después, se fueron con el tiempo que esperaste." },
    { parte: "Acción", timing: "~8 seg", clase: "accion", texto: "No estoy diciendo que te lances sin aprender. Estoy diciendo que cada mes que postergas sin avanzar, también tiene un precio. Sígueme, te sigo enseñando cómo se construye eso paso a paso." }
  ],
  notas: [
    { icon: "⚡", titulo: "Ritmo y energía", texto: "Directo y sereno, sin alarmismo — es un dato que invita a reflexionar, no un susto para presionar.", cta: false },
    { icon: "😐", titulo: "Expresión", texto: "Seria y calmada, con énfasis en \"ese año no vuelve\".", cta: false },
    { icon: "🤲", titulo: "Gestos", texto: "Gesto de \"reloj\"/tiempo pasando (mano moviéndose de izquierda a derecha); gesto de \"vacío\" (manos abiertas) al decir \"no vuelve\".", cta: false },
    { icon: "🎬", titulo: "Visuales sugeridos", texto: "Overlay simple: \"$6M/mes → 12 meses → $72M no recibidos\". Talking head, sin B-roll adicional.", cta: false },
    { icon: "🎵", titulo: "Audio", texto: "Track reflexivo y calmado, sin urgencia sonora.", cta: false },
    { icon: "📢", titulo: "CTA", texto: "Verbal + texto en pantalla: \"Sígueme, te sigo enseñando paso a paso\".", cta: true }
  ],
  descripcion: "Postergar tu primera propiedad un año más no es gratis.\n\nSi una propiedad te puede dejar $6 millones al mes, y esperas un año más para empezar, ese año te costó $72 millones que pudiste haber recibido y no recibiste. No sale de tu bolsillo — pero tampoco entra al tuyo.\n\nY ese año no vuelve.\n\n👉 Sígueme, te sigo enseñando cómo se construye eso paso a paso.",
  hashtags: ["#ConquistaTuPatrimonio","#LibertadFinanciera","#MentalidadDeInversor","#InversionInmobiliaria","#BienesRaicesColombia"]
},
{
  numero: "Guión 03 · Embudo 1", titulo: "Por Qué el Coliving Es el Modelo Que el Mercado Está Pidiendo",
  bloque: "📊 Comparativas", tipo: "Explicación de Tendencia · #11 (ya grabado)",
  palanca: "Validación con datos (DANE) + urgencia de mercado real", duracion: "~155–165 seg",
  guion: [
    { parte: "Gancho", timing: "~10 seg", clase: "gancho", texto: "Yo sé que uno sueña con comprarse una casa y le parece la mejor inversión en bienes raíces. Pero no, no siempre es así." },
    { parte: "Relevancia", timing: "~28 seg", clase: "relevancia", texto: "Muy pocas personas tienen hoy en día para alquilar una casa grande. Y cada vez las familias son más pequeñas. Entonces, una pareja de novios o un estudiante no necesita tanto espacio para vivir — empezando porque prácticamente nunca están en la casa. Además, el porcentaje de rentabilidad en una casa tradicional es muy bajito, casi que te deja más plata invertir ese dinero en un CDT, que también es un muy mal negocio. Pero mira que ahí es donde viene la oportunidad." },
    { parte: "Valor", timing: "~100 seg", clase: "valor", texto: "Desde hace varios años se está desarrollando un nuevo modelo de vivienda, y se llama Coliving. Es básicamente dividir una casa tradicional en varios apartamentos más pequeños. Es una propiedad que va a tener muy buenos acabados, y en donde, a diferencia de un inquilinato de muy mala calidad, vas a proveer espacios comunes increíbles: zonas de comida, zonas de lavado, zonas de entretenimiento, barbecue, terraza y muchos amenities más. Con este modelo de vivienda, las personas que vivan allí van a mejorar muchísimo su estilo de vida. Hay que tener algo claro: este tipo de vivienda no es para todo el mundo. Pero, por ejemplo, imagínate un joven o una persona que está buscando independizarse y que no tiene para alquilar una propiedad grande. Su prioridad no va a ser la cantidad de espacio requerido — va a priorizar la comodidad, la ubicación. Y seguramente va a pasar la mayor parte de su tiempo por fuera, estudiando. ¿Y sabes qué es lo más loco? Que hoy en Colombia no hay muchas propiedades con estas características, y es justo lo que el mercado está buscando. Cada vez que se abre uno de estos —y ya se han abierto muchos en varias ciudades del país— se rentan demasiado rápido, porque ese modelo de comunidad es lo que las personas están buscando. Y esto no es una tendencia pasajera: fíjate en los datos que arroja el DANE, se proyecta que para el 2035 las familias sean todavía más pequeñas. Y claro, eso te permite a ti, como inversionista en bienes raíces, generar una rentabilidad muchísimo más alta: puedes dividir una propiedad en múltiples rentas. Las personas ahora buscan practicidad, y entre ser prácticos está vivir cerca a todo lo necesario para mantener un excelente estilo de vida —universidades, trabajo, comercio— sin tener que pagar arriendos carísimos." },
    { parte: "Acción", timing: "~14 seg", clase: "accion", texto: "Si quieres saber la mejor manera de sacarle provecho a esto en bienes raíces, sígueme — te voy a seguir mostrando cómo se hace, paso a paso." }
  ],
  notas: [
    { icon: "⚡", titulo: "Ritmo y energía", texto: "Conversacional y sostenido — al ser un guion largo (2:40 aprox.), la energía no puede ser plana todo el tiempo; sube ligeramente en \"¿Y sabes qué es lo más loco?\" y en el dato del DANE.", cta: false },
    { icon: "😐", titulo: "Expresión", texto: "Cercana y reflexiva en el gancho/relevancia; genuina curiosidad y convicción en el tramo del DANE y la demanda real.", cta: false },
    { icon: "🤲", titulo: "Gestos", texto: "Gesto de \"espacio dividiéndose\" (manos separándose) al explicar el coliving; enumerar amenities con la mano abriéndose.", cta: false },
    { icon: "🎬", titulo: "Visuales sugeridos", texto: "B-roll real de una propiedad coliving ya rentada: zonas comunes, terraza, zona de lavado. Overlay del dato del DANE en el momento exacto en que se menciona.", cta: false },
    { icon: "🎵", titulo: "Audio", texto: "Track conversacional de fondo, bajo volumen constante.", cta: false },
    { icon: "📢", titulo: "CTA", texto: "Verbal + texto en pantalla: \"Sígueme, te sigo mostrando cómo se hace paso a paso\" — CTA de seguimiento, ya no de comentario/DM.", cta: true }
  ],
  descripcion: "Yo sé que uno sueña con comprarse una casa y le parece la mejor inversión en bienes raíces. Pero no siempre es así.\n\nLas familias son cada vez más pequeñas, y muy pocas personas necesitan (o pueden pagar) una casa grande. Ahí es donde entra el coliving: dividir una propiedad tradicional en varios espacios, con buenos acabados y zonas comunes reales, pensada para quien prioriza comodidad y ubicación sobre metros cuadrados.\n\nNo es una moda — los datos del DANE proyectan que para 2035 las familias van a ser todavía más pequeñas. Eso es más demanda real para este modelo, y más rentabilidad para quien invierte así.\n\n👉 Sígueme, te sigo mostrando cómo sacarle provecho a esto paso a paso.",
  hashtags: ["#ConquistaTuPatrimonio","#ColivingColombia","#InversionInmobiliaria","#BienesRaicesColombia","#Flipping20"]
},
{
  numero: "Guión 04 · Embudo 1", titulo: "Las 3 Tendencias de Vivienda Que se Están Llevando el Mercado",
  bloque: "📊 Comparativas", tipo: "Explicación de Tendencia · #12 (ya grabado)",
  palanca: "Urgencia de adaptación + datos de mercado (DANE/arrendatarios)", duracion: "~75–85 seg",

let current = 0;
let currentTab = 'guion';

function render() {
  const r = reels[current];
  document.getElementById('counter-current').textContent = current + 1;
  document.getElementById('counter-total').textContent = reels.length;
  document.getElementById('progress-fill').style.width = ((current + 1) / reels.length * 100) + '%';

  document.getElementById('f-numero').textContent = r.numero;
  document.getElementById('f-titulo').textContent = r.titulo;
  document.getElementById('f-bloque').textContent = r.bloque;
  document.getElementById('f-tipo').textContent = r.tipo;
  document.getElementById('f-palanca').textContent = r.palanca;
  document.getElementById('f-duracion').textContent = r.duracion;

  const meta = document.getElementById('meta');
  meta.style.animation = 'none';
  void meta.offsetWidth;
  meta.style.animation = 'fadeUp 0.4s ease forwards';

  const tabGuion = document.getElementById('tab-guion');
  tabGuion.innerHTML = r.guion.map(p => `
    <div class="script-block">
      <div class="script-label label-${p.clase}">${p.parte} <span class="script-timing">${p.timing}</span></div>
      <div class="script-text ${p.clase}">${p.texto}</div>
    </div>
  `).join('');

  const tabNotas = document.getElementById('tab-notas');
  tabNotas.innerHTML = `<div class="notes-grid">` + r.notas.map(n => `
    <div class="note-card ${n.cta ? (n.icon === '⚠️' ? 'warn-note' : 'cta-note') : ''}">
      <div class="note-head"><span class="note-icon">${n.icon}</span><span class="note-title">${n.titulo}</span></div>
      <div class="note-text">${n.texto}</div>
    </div>
  `).join('') + `</div>`;

  const tabDesc = document.getElementById('tab-descripcion');
  tabDesc.innerHTML = `
    <div class="desc-box">
      <button class="desc-copy-btn" id="copy-btn" onclick="copyDesc()">Copiar</button>
      <div class="desc-text">${r.descripcion}</div>
      <div class="hashtags">${r.hashtags.map(h => `<span class="hashtag">${h}</span>`).join('')}</div>
    </div>
  `;

  document.getElementById('btn-prev').disabled = current === 0;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = current === reels.length - 1 ? '✓ Fin' : 'Siguiente →';

  renderDots();
  [...document.querySelectorAll('.tab-content')].forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + currentTab).classList.add('active');
  [...document.querySelectorAll('.tab')].forEach(el => el.classList.toggle('active', el.dataset.tab === currentTab));
}

function renderDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = reels.map((_, i) => `<button class="dot ${i === current ? 'active' : ''}" onclick="goTo(${i})"></button>`).join('');
}

function switchTab(tab) {
  currentTab = tab;
  [...document.querySelectorAll('.tab-content')].forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  [...document.querySelectorAll('.tab')].forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
}

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next > reels.length - 1) return;
  current = next;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goTo(i) {
  current = i;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyDesc() {
  const r = reels[current];
  const text = r.descripcion + '\n\n' + r.hashtags.join(' ');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    const original = btn.textContent;
    btn.textContent = '✓ Copiado';
    setTimeout(() => { btn.textContent = original; }, 2000);
  });
}

render();
</script>
</body>
