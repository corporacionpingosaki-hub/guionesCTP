
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --navy: #0F2544; --navy-dark: #091a33; --lime: #00C96E; --lime-dim: #00a85c;
    --lime-soft: rgba(0,201,110,0.12); --lime-softer: rgba(0,201,110,0.06);
    --text-primary: #e8edf4; --text-secondary: #8fa3bf; --text-muted: #5a7494;
    --border: rgba(255,255,255,0.08); --border-lime: rgba(0,201,110,0.3);
    --card-bg: rgba(255,255,255,0.04); --card-hover: rgba(255,255,255,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Inter', sans-serif; background: var(--navy-dark); color: var(--text-primary); min-height: 100vh; }

  .header { background: var(--navy); border-bottom: 1px solid var(--border); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 8px; height: 8px; background: var(--lime); border-radius: 50%; animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)} }
  .brand-name { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .brand-sub { font-size: 11px; color: var(--lime); letter-spacing: .03em; }
  .counter { font-size: 12px; color: var(--text-muted); }
  .counter span { color: var(--lime); font-weight: 600; }

  .progress-bar { height: 2px; background: var(--border); }
  .progress-fill { height: 100%; background: var(--lime); transition: width .4s ease; }

  .main { max-width: 780px; margin: 0 auto; padding: 36px 24px 80px; }

  .ad-meta { margin-bottom: 28px; animation: fadeUp .4s ease forwards; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }
  .ad-number { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--lime); margin-bottom: 8px; }
  .ad-title { font-size: 22px; font-weight: 600; line-height: 1.3; color: #fff; margin-bottom: 12px; }
  .ad-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 500; padding: 3px 11px; border-radius: 20px; }
  .tag-tecnica { background: rgba(127,119,221,.15); color: #a8a1f0; border: 1px solid rgba(127,119,221,.25); }
  .tag-formato { background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--border); }
  .tag-dur { background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--border); }

  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .tab { padding: 11px 18px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .2s, border-color .2s; }
  .tab:hover { color: var(--text-secondary); }
  .tab.active { color: var(--lime); border-bottom-color: var(--lime); }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeUp .3s ease forwards; }

  .section-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content:''; flex:1; height:1px; background: var(--border); }
  .label-hook { color: #a8a1f0; }
  .label-cuerpo { color: #f0b429; }
  .label-cta { color: #f08070; }

  .script-block { font-size: 15px; line-height: 1.75; background: var(--card-bg); border-radius: 10px; padding: 16px 20px; white-space: pre-wrap; margin-bottom: 14px; border-left: 3px solid; }
  .block-hook { border-color: #7F77DD; }
  .block-cuerpo { border-color: #f0b429; }
  .block-cta-block { border-color: #f08070; }

  .notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .note-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .note-title { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .note-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .note-full { grid-column: 1/-1; background: var(--lime-softer); border-color: var(--border-lime); }

  .copy-box { position: relative; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 22px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .copy-btn { position: absolute; top: 14px; right: 14px; background: var(--lime-soft); border: 1px solid var(--border-lime); color: var(--lime); font-size: 11px; font-weight: 600; padding: 5px 13px; border-radius: 20px; cursor: pointer; font-family: inherit; transition: background .2s; }
  .copy-btn:hover { background: rgba(0,201,110,.2); }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--border); }
  .nav-btn { display: flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s; font-family: inherit; }
  .nav-btn:hover:not(:disabled) { background: var(--card-hover); color: #fff; }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  .nav-btn.next { background: var(--lime); border-color: var(--lime); color: var(--navy-dark); font-weight: 600; }
  .nav-btn.next:hover:not(:disabled) { background: var(--lime-dim); border-color: var(--lime-dim); }
  .dots { display: flex; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); cursor: pointer; transition: all .2s; }
  .dot.active { background: var(--lime); width: 18px; border-radius: 3px; }

  @media(max-width:580px){ .notes-grid{grid-template-columns:1fr} .note-full{grid-column:1} .ad-title{font-size:18px} .tab{padding:9px 13px;font-size:12px} }
</style>
</head>
<body>

<div class="main">

  <div class="tab-content" id="tab-copy"></div>

  <div class="nav">
    <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← Anterior</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn next" id="btn-next" onclick="navigate(1)">Siguiente →</button>

let cur = 0, curTab = 'guion';

function render() {
  const a = ads[cur];
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('tot').textContent = ads.length;
  document.getElementById('pbar').style.width = ((cur+1)/ads.length*100)+'%';

  const meta = document.getElementById('ad-meta');
  meta.innerHTML = `
    <div class="ad-number">${a.numero}</div>
    <div class="ad-title">${a.titulo}</div>
    <div class="ad-tags">
      <span class="tag tag-tecnica">${a.tecnica}</span>
      <span class="tag tag-formato">${a.formato}</span>
      <span class="tag tag-dur">⏱ ${a.duracion}</span>
    </div>`;
  meta.style.animation='none'; void meta.offsetWidth; meta.style.animation='fadeUp .4s ease forwards';

  document.getElementById('tab-guion').innerHTML = `
    <div class="section-label label-hook" style="margin-bottom:8px">Hook</div>
    <div class="script-block block-hook" style="margin-bottom:16px">${a.hook}</div>
    <div class="section-label label-cuerpo" style="margin-bottom:8px">Cuerpo</div>
    <div class="script-block block-cuerpo" style="margin-bottom:16px">${a.cuerpo}</div>
    <div class="section-label label-cta" style="margin-bottom:8px">CTA</div>
    <div class="script-block block-cta-block">${a.cta}</div>`;

  document.getElementById('tab-notas').innerHTML = `
    <div class="notes-grid">${a.notas.map(n=>`
      <div class="note-card${n.full?' note-full':''}">
        <div class="note-title">${n.t}</div>
        <div class="note-text">${n.c}</div>
      </div>`).join('')}</div>`;

  document.getElementById('tab-copy').innerHTML = `
    <div class="copy-box">
      <button class="copy-btn" onclick="copyCopy()">Copiar</button>${a.copy}
    </div>`;

  document.getElementById('dots').innerHTML = ads.map((_,i)=>`<div class="dot${i===cur?' active':''}" onclick="goTo(${i})"></div>`).join('');
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===ads.length-1;
  document.getElementById('btn-next').textContent = cur===ads.length-1 ? '✓ Fin' : 'Siguiente →';

  switchTab(curTab, false);
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchTab(t, scroll) {
  curTab = t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['guion','notas','copy'][i]===t));
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
}

function navigate(d) { cur = Math.max(0,Math.min(ads.length-1,cur+d)); render(); }
function goTo(i) { cur=i; render(); }
function copyCopy() {
  navigator.clipboard.writeText(ads[cur].copy).then(()=>{
    const b=document.querySelector('.copy-btn');
    b.textContent='✓ Copiado'; setTimeout(()=>b.textContent='Copiar',2000);
  });
}
render();
</script>
