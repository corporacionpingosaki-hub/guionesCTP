<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guiones CTP · Lotes 1 y 2</title>
<style>
:root{--navy:#0F2544;--navy-light:#1a3560;--navy-dark:#091a33;--lime:#00C96E;--lime-dim:#00a85c;--lime-soft:rgba(0,201,110,.12);--lime-softer:rgba(0,201,110,.06);--white:#fff;--text-primary:#e8edf4;--text-secondary:#8fa3bf;--text-muted:#5a7494;--border:rgba(255,255,255,.08);--border-lime:rgba(0,201,110,.3);--card-bg:rgba(255,255,255,.04);--card-hover:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy-dark);color:var(--text-primary);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.header{position:sticky;top:0;z-index:10;background:rgba(9,26,51,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;max-width:900px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand-dot{width:8px;height:8px;background:var(--lime);border-radius:50%;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.brand-name{font-weight:600;font-size:14px;color:var(--white)}
.brand-handle{font-size:12px;color:var(--text-muted)}
.counter{font-size:13px;color:var(--text-secondary)}.counter b{color:var(--lime)}
.progress-bar{height:2px;background:var(--border)}.progress-fill{height:100%;background:var(--lime);transition:width .4s ease}
.main{max-width:900px;margin:0 auto;padding:40px 32px 80px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.reel-num{color:var(--lime);text-transform:uppercase;font-size:11px;font-weight:600;letter-spacing:.08em;margin-bottom:8px}
.reel-title{color:var(--white);font-size:26px;font-weight:600;line-height:1.25;margin-bottom:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.tag{font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px}
.tag-bloque{background:rgba(127,119,221,.15);color:#a8a1f0;border:1px solid rgba(127,119,221,.25)}
.tag-tipo{background:var(--lime-softer);color:var(--lime);border:1px solid var(--border-lime)}
.tag-palanca,.tag-duracion{background:rgba(255,255,255,.06);color:var(--text-secondary);border:1px solid var(--border)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:28px}
.tab{background:none;border:none;color:var(--text-secondary);font:inherit;font-size:13px;font-weight:500;padding:12px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--white)}.tab.active{color:var(--lime);border-bottom-color:var(--lime)}
.panel{display:none}.panel.active{display:block}
.block{margin-bottom:24px}
.block-label{display:flex;gap:10px;align-items:baseline;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.block-label span{color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0}
.label-gancho{color:#a8a1f0}.label-relevancia{color:var(--lime)}.label-valor{color:#f0b429}.label-accion{color:#f08070}
.script-text{font-size:15px;line-height:1.75;white-space:pre-line;padding:14px 18px;background:var(--card-bg);border-radius:0 8px 8px 0;border-left:3px solid}
.script-text.gancho{border-color:#7F77DD}.script-text.relevancia{border-color:#00C96E}.script-text.valor{border-color:#f0b429}.script-text.accion{border-color:#f08070}
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.note:hover{background:var(--card-hover)}
.note-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:6px}
.note-text{font-size:13px;line-height:1.6;color:var(--text-secondary);white-space:pre-line}
.cta-note{grid-column:1/-1;background:var(--lime-softer);border-color:var(--border-lime)}
.cta-note .note-text{color:var(--text-primary)}
.desc-box{position:relative;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:24px 20px 20px}
.desc-text{font-size:14px;line-height:1.7;white-space:pre-line;padding-right:90px}
.desc-copy-btn{position:absolute;top:16px;right:16px;background:var(--lime-soft);border:1px solid var(--border-lime);color:var(--lime);font:inherit;font-size:11px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;transition:background .2s}
.desc-copy-btn:hover{background:rgba(0,201,110,.2)}
.hashtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.hashtag{font-size:12px;color:var(--lime);background:var(--lime-softer);padding:3px 10px;border-radius:20px;border:1px solid var(--border-lime)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;gap:12px}
.nav-btn{padding:12px 24px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-secondary);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.nav-btn:hover:not(:disabled){background:var(--card-hover);color:var(--white)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.next{background:var(--lime);border-color:var(--lime);color:var(--navy-dark);font-weight:600}
.nav-btn.next:hover:not(:disabled){background:var(--lime-dim);border-color:var(--lime-dim)}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);cursor:pointer;transition:all .2s}
.dot.active{background:var(--lime);width:20px;border-radius:3px}
.decide{display:flex;gap:8px;align-items:center;margin:-12px 0 28px;flex-wrap:wrap}
.decide-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.dec-btn{font:inherit;font-size:12px;font-weight:600;padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-secondary);cursor:pointer;transition:all .2s}
.dec-btn:hover{color:var(--white)}
.dec-btn.on.si{background:var(--lime-soft);border-color:var(--lime);color:var(--lime)}
.dec-btn.on.no{background:rgba(240,128,112,.15);border-color:#f08070;color:#f08070}
.dec-btn.on.rev{background:rgba(240,180,41,.15);border-color:#f0b429;color:#f0b429}
.summary-btn{font:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;border:1px solid var(--border-lime);background:var(--lime-softer);color:var(--lime);cursor:pointer;margin-left:12px}
.summary{display:none}.summary.active{display:block}
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sum-title{font-size:22px;font-weight:600;color:var(--white)}
.sum-counts{font-size:13px;color:var(--text-secondary)}
.sum-table{width:100%;border-collapse:collapse;font-size:13px}
.sum-table th{text-align:left;color:var(--text-muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--border)}
.sum-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.sum-table tr{cursor:pointer}.sum-table tr:hover td{background:var(--card-hover)}
.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.si{background:var(--lime-soft);color:var(--lime)}.pill.no{background:rgba(240,128,112,.15);color:#f08070}.pill.rev{background:rgba(240,180,41,.15);color:#f0b429}.pill.none{background:rgba(255,255,255,.06);color:var(--text-muted)}
.sum-actions{display:flex;gap:8px}
@media (max-width:600px){.sum-table .hide-m{display:none}.summary-btn{margin-left:0}}
@media (max-width:600px){.header-inner{padding:16px 20px}.main{padding:28px 16px 60px}.reel-title{font-size:20px}.notes-grid{grid-template-columns:1fr}.cta-note{grid-column:1}.tab{padding:10px 14px;font-size:12px}.desc-text{padding-right:0;padding-top:24px}.nav-btn{padding:10px 14px}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="brand"><div class="brand-dot"></div><div><div class="brand-name">Conquista Tu Patrimonio</div><div class="brand-handle">@el_pingo83</div></div></div>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px"><div class="counter">Guión <b id="cur">1</b> de <span id="tot"></span></div><button class="summary-btn" id="sumBtn" onclick="toggleSummary()">Resumen</button></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
</header>
<main class="main">
  <section class="summary" id="summary">
    <div class="sum-head"><div><div class="sum-title">Qué grabamos</div><div class="sum-counts" id="sumCounts"></div></div>
      <div class="sum-actions"><button class="desc-copy-btn" style="position:static" onclick="copyDecisions(this)">Copiar decisiones</button><button class="nav-btn" onclick="toggleSummary()">Volver</button></div></div>
    <table class="sum-table"><thead><tr><th>#</th><th>Guion</th><th class="hide-m">Tipo</th><th class="hide-m">Largo</th><th>Decisión</th></tr></thead><tbody id="sumBody"></tbody></table>
  </section>
  <div id="detail">
  <div id="meta"></div>

  <div class="tabs">
    <button class="tab active" data-tab="guion" onclick="switchTab('guion')">Guión</button>
    <button class="tab" data-tab="notas" onclick="switchTab('notas')">Notas de grabación</button>
    <button class="tab" data-tab="desc" onclick="switchTab('desc')">Descripción del post</button>
  </div>
  <div class="panel active" id="p-guion"></div>
  <div class="panel" id="p-notas"></div>
  <div class="panel" id="p-desc"></div>
  <div class="nav">
    <button class="nav-btn" id="prev" onclick="navigate(-1)">← Anterior</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn next" id="next" onclick="navigate(1)">Siguiente →</button>
  </div>
  </div>
</main>
<script>
const reels = [{"numero": "Guión 01 · R013", "titulo": "La renta tradicional ya no sirve", "bloque": "🔥 Opinión", "tipo": "#22 Refrán al revés", "palanca": "Pelea con una creencia común (con números)", "duracion": "~45 seg", "guion": [{"parte": "Gancho", "timing": "~4 seg", "clase": "gancho", "texto": "La renta tradicional ya no sirve.\nTe lo voy a repetir cien veces."}, {"parte": "Relevancia", "timing": "~9 seg", "clase": "relevancia", "texto": "Siempre escucho lo mismo: \"con que el apartamentico pague la cuota, ya es suficiente\".\nO \"compremos sobre planos para que se valorice\".\nNo, parce. Eso es sobrevivir con bienes raíces."}, {"parte": "Valor", "timing": "~27 seg", "clase": "valor", "texto": "¿Sabés cuánto renta hoy un apartamento tradicional?\nCero coma cuatro, cero coma cinco por ciento al mes.\nY amarrado a una deuda a veinte años.\nEso es deuda con maquillaje.\nSi querés que la renta trabaje de verdad, necesitás estrategias más fuertes.\nMultirrenta, coliving, Flipping dos punto cero o construir desde cero.\nY si yo me quebrara mañana, arrancaría con rent to rent.\nSí, toca estudiar y toca ejecutar.\nPero bien hecho, cualquiera de esos modelos te puede dejar\nde cinco a siete veces más que una renta tradicional, con la misma plata."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "Regrabación del reel 013 (10.266 vistas, 23 seguidores). ~45 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 1.7 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Firme y desafiante, sin enojo: estás defendiendo una postura.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Negar con la mano en 'No, parce'; marcar 0,4% con los dedos.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Números dichos por Camilo en el original (0,4-0,5% mensual, deuda a 20 años, 5 a 7 veces más). Confirmar que siguen vigentes antes de grabar.\n\nTarjetas: 0:00 LA RENTA TRADICIONAL YA NO SIRVE · 0:04 “QUE PAGUE LA CUOTA” · 0:14 0,4% - 0,5% AL MES · 0:17 DEUDA A 20 AÑOS · 0:24 MULTIRRENTA · COLIVING · FLIPPING · 0:27 ARRANCARÍA CON RENT TO RENT · 0:35 5 A 7 VECES MÁS · 0:39 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Regrabación del reel 013, el de mejor conversión de los cinco (73 guardados, 70 compartidos, 23 seguidores). Dejé una sola frase de choque ('Eso es deuda con maquillaje') en vez de las dos 'eso no es X, eso es Y' del original. 'Si yo me quebrara mañana, arrancaría con rent to rent' conecta con el reel 002, el mejor de la cuenta.", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "Un apartamento en renta tradicional deja hoy entre 0,4% y 0,5% al mes, amarrado a una deuda a 20 años.\n\nMultirrenta, coliving, Flipping 2.0 o construcción desde cero: bien hechos, pueden dejar de 5 a 7 veces más ingreso con la misma plata.\n\nSi quieres que seamos tus mentores en este camino de construir patrimonio, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#RentToRent", "#ColivingColombia", "#Multirrenta", "#InversionInmobiliaria"]}, {"numero": "Guión 02 · V4", "titulo": "¿Pierdes la inversión en rent to rent?", "bloque": "🧠 Educativo", "tipo": "Objeción · #16 Pregunta textual", "palanca": "Miedo a perder la inversión", "duracion": "~60 seg", "guion": [{"parte": "Gancho", "timing": "~5 seg", "clase": "gancho", "texto": "¿Perdés la plata si la casa no es tuya?\nEs lo que más me preguntan del rent to rent."}, {"parte": "Relevancia", "timing": "~6 seg", "clase": "relevancia", "texto": "\"Le meto veinte millones y después se pierde todo.\"\nY por ese miedo, mucha gente nunca arranca.\nOjo con esto."}, {"parte": "Valor", "timing": "~43 seg", "clase": "valor", "texto": "Hay dos formas de verlo: como un gasto, o como una inversión.\nY se paga sola si el negocio queda bien armado.\nDigamos que te deja un millón y medio al mes.\nEsa plata no es para gastarla.\nCon eso pagás el crédito de los veinte millones.\nEn doce meses ya van dieciocho.\nCasi toda la inversión, de vuelta en el primer año.\nY lo que aprendés operando esa casa vale tanto como la plata.\n¿Y si se desocupa?\nOjo, en un coliving no se desocupa la casa entera.\nSi tenés diez habitaciones y se va una,\nperdés el diez por ciento, no el cien.\nY si la casa pasa nuestra métrica dorada,\ndos coma cinco veces el arriendo,\ncon cuatro de cada diez habitaciones ocupadas\nya pagás el arriendo.\nPor eso lo que importa es elegir bien la casa.\nSi yo tuviera que empezar de cero, empezaría por acá."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "~60 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 2.6 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Seguro y cercano, como respondiendo a alguien que te lo preguntó en persona.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Mano abierta en la pregunta; contar con los dedos el 12 x 1,5.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Tarjetas: 0:00 ¿Y SI LA CASA NO ES TUYA? · 0:05 “PIERDO LOS 20 MILLONES” · 0:11 GASTO O INVERSIÓN · 0:17 1,5 MILLONES AL MES · 0:25 12 x 1,5 = 18 MILLONES · 0:33 ¿Y SI SE DESOCUPA? · 0:37 SE VA 1 DE 10 = -10% · 0:45 4 DE 10 OCUPADAS = ARRIENDO PAGO · 0:48 ¿ELEGISTE BIEN LA CASA? · 0:54 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Los 18 millones salen de la cuenta 12 x 1,5 sobre las cifras del borrador original; no es un caso puntual. Cambié 'El rent to rent no solo es dinero, es experiencia...' por una frase sin la estructura 'no es X, es Y'. Complementé '¿Y si se desocupa?' con dos respuestas de la propia metodología: en coliving se pierde una habitación, no la casa (reel 007), y con la métrica dorada (2,5 veces el arriendo) el arriendo se cubre con el 40% de ocupación.", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "¿Pierdes los 20 millones si la casa no es tuya y se acaba el contrato?\n\nEs la duda que más frena a la gente con el rent to rent.\n\nSi el negocio queda bien armado y te deja 1,5 millones al mes, en 12 meses son 18 millones: recuperas casi toda la inversión en el primer año.\n\n¿Y si se desocupa? En un coliving de 10 habitaciones, si se va una pierdes el 10%, no el 100%. Y si la casa genera al menos 2,5 veces el arriendo, con 4 de cada 10 habitaciones ocupadas ya pagas el arriendo. Por eso lo que importa es elegir bien la casa.\n\nSi quieres que seamos tus mentores en este camino de construir patrimonio, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#RentToRent", "#ColivingColombia", "#InversionInmobiliaria"]}, {"numero": "Guión 03 · V5", "titulo": "El truco del aseo (versión a cámara)", "bloque": "💰 Prueba", "tipo": "#29 El Truco", "palanca": "Ahorro real con recibo", "duracion": "~39 seg", "guion": [{"parte": "Gancho", "timing": "~6 seg", "clase": "gancho", "texto": "Este truco me está ahorrando medio millón al mes.\nEn un edificio estaba pagando un millón doce mil pesos de aseo."}, {"parte": "Relevancia", "timing": "~5 seg", "clase": "relevancia", "texto": "Miren el recibo.\nY me di cuenta de algo.\nVos podés elegir la empresa de aseo que quieras."}, {"parte": "Valor", "timing": "~23 seg", "clase": "valor", "texto": "No tenés que quedarte con la que viene en el recibo.\nEn Colombia existe la libertad de cambiarte de prestador, si cumplís las condiciones.\nMe cambié de empresa y ahora pago cuatrocientos ochenta mil.\nMismo servicio.\nMás de quinientos mil pesos de diferencia, cada mes.\nCasi nadie revisa esto, y están perdiendo plata todos los meses.\nLa rentabilidad también está en lo que dejás de pagar.\nRevisá cuánto estás pagando hoy.\nY si querés que te ayudemos a encontrar estos ahorros"}, {"parte": "Acción", "timing": "~5 seg", "clase": "accion", "texto": "y a armar negocios que te dejen plata de verdad,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "~39 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 2.6 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Sorpresa genuina al mostrar el recibo; tono de quien comparte un descubrimiento.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Sostener el recibo frente a cámara en 'Miren el recibo'; señalar las dos cifras.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Mostrar el recibo real en cámara en 'Miren el recibo' (tapando datos personales y dirección).\n\nTarjetas: 0:00 MEDIO MILLÓN AL MES · 0:03 $1.012.000 DE ASEO · 0:09 PUEDES CAMBIAR DE EMPRESA · 0:18 AHORA: $480.000 · 0:21 -$532.000 AL MES · 0:30 REVISA TU RECIBO · 0:00 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Versión nueva a cámara del reel 004 (20,6 mil vistas, 201 guardados, 131 compartidos). El original duraba 2 minutos; esta, menos de 45 segundos. Cambié 'Mismo servicio, menor costo, más utilidad' (tríada) por la diferencia concreta: 1.012.000 - 480.000 = 532.000. Cambié 'No es solo generar más ingresos, es también reducir costos' (estructura 'no es solo X, es Y'). CTA con variación (pedido del equipo): misma palabra PATRIMONIO para no romper la automatización, pero con un texto atado al tema del ahorro.", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "Pagaba $1.012.000 de aseo en un edificio. Hoy pago $480.000 por el mismo servicio.\n\nEn Colombia puedes cambiar de empresa prestadora del servicio de aseo si cumples las condiciones. No tienes que quedarte con la que viene en el recibo.\n\nSon más de $500.000 al mes que se quedan como utilidad. Revisa cuánto estás pagando hoy.\n\nSi quieres que te ayudemos a encontrar estos ahorros y a armar negocios que te dejen plata de verdad, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#ColivingColombia", "#InversionInmobiliaria", "#Multirrenta"]}, {"numero": "Guión 04 · R012", "titulo": "Si empezás, terminá: el proyecto a medias", "bloque": "🧠 Educativo", "tipo": "#1 Confesión de costo", "palanca": "Lección aprendida a la fuerza", "duracion": "~51 seg", "guion": [{"parte": "Gancho", "timing": "~5 seg", "clase": "gancho", "texto": "Si empezás, terminá. Esa frase me salvó de la quiebra.\nMirá lo que es un proyecto a medias."}, {"parte": "Relevancia", "timing": "~6 seg", "clase": "relevancia", "texto": "Tu plata congelada en una obra sin terminar.\nPagás vigilancia, impuestos y mantenimiento.\nY entra cero pesos. Ni renta, ni venta."}, {"parte": "Valor", "timing": "~34 seg", "clase": "valor", "texto": "Te desangra hasta que lo terminás o hasta que te quebrás.\nLo que pase primero.\nOjo con esto.\nUn inmueble vale por lo que produce, no por lo que costó.\nUna obra en negra o en gris\nvale una fracción de lo que le metiste.\nEs como un carro sin motor.\nYo lo aprendí de la forma más dolorosa.\nPor eso hoy, antes de arrancar cualquier proyecto, proyectamos tres cosas.\nUno, todos los costos, hasta el último tornillo.\nDos, el flujo de caja mes a mes,\npara no quedarnos sin plata a mitad de camino.\nTres, un colchón para los imprevistos, que siempre aparecen.\nY si hoy tenés un proyecto parado,\ncada día sin terminarlo te cuesta más que terminarlo."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "Regrabación del reel 012 (10.467 vistas). ~51 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 2.9 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Serio al contar el dolor, más liviano al dar las tres cosas.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Contar uno, dos, tres con los dedos en los tres puntos.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Si hay imágenes de una obra parada (negra o gris), usarlas en los primeros segundos.\n\nTarjetas: 0:00 SI EMPIEZAS, TERMINA · 0:07 VIGILANCIA, IMPUESTOS, MANTENIMIENTO · 0:09 $0 DE INGRESO · 0:15 VALE POR LO QUE PRODUCE · 0:24 UN CARRO SIN MOTOR · 0:31 1. TODOS LOS COSTOS · 0:33 2. FLUJO MES A MES · 0:38 3. COLCHÓN · 0:45 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Regrabación del reel 012. El original duraba ~109 s; esta versión, menos de un minuto. Saqué 'No es motivación, es matemática pura' (estructura 'no es X, es Y') y el segundo pedido ('envíale este video'): el original pedía RESCATE y compartir a la vez.", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "Un proyecto a medias te cobra todos los meses y no te paga nada.\n\nVigilancia, impuestos y mantenimiento, con cero pesos de renta o de venta.\n\nUn inmueble vale por lo que produce. Una obra en negra o en gris vale una fracción de lo que se invirtió.\n\nPor eso, antes de arrancar cualquier proyecto, proyectamos tres cosas: todos los costos, el flujo de caja mes a mes y un colchón para imprevistos.\n\nSi quieres que seamos tus mentores en este camino de construir patrimonio, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#DesarrolloInmobiliario", "#InversionInmobiliaria", "#BienesRaicesColombia"]}, {"numero": "Guión 05 · V11", "titulo": "La zona de lavado deja plata", "bloque": "💰 Prueba", "tipo": "#29 El Truco", "palanca": "Ingreso extra con cifra real", "duracion": "~35 seg", "guion": [{"parte": "Gancho", "timing": "~6 seg", "clase": "gancho", "texto": "La zona de lavado nos deja casi un millón de pesos al mes.\nCasi todo el mundo la ve como un gasto."}, {"parte": "Relevancia", "timing": "~7 seg", "clase": "relevancia", "texto": "En un coliving, es plata.\nLas habitaciones son el ingreso principal, pero no el único.\nY ahí es donde la mayoría deja plata sobre la mesa."}, {"parte": "Valor", "timing": "~16 seg", "clase": "valor", "texto": "Mirá cómo funciona.\nLavadora, seis mil pesos por ciclo.\nSecadora, otros seis mil.\nSe cobra por uso.\nEn una casa de veinticinco habitaciones, y sin que todos laven,\neso deja más o menos un millón al mes.\nOjo, cada metro cuadrado puede dejar algo.\nEsa es la diferencia entre una casa arrendada y una bien trabajada."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "~35 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 3.7 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Práctico y concreto, mostrando la operación por dentro.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Señalar las máquinas; marcar con la mano 'seis mil' y 'un millón'.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Grabar con la zona de lavado real en cámara (las máquinas, el sistema de cobro).\n\nTarjetas: 0:00 CASI 1 MILLÓN AL MES · 0:04 ¿UN GASTO? · 0:15 LAVADORA: $6.000 · 0:16 SECADORA: $6.000 · 0:19 25 HABITACIONES · 0:24 CADA METRO DEJA ALGO · 0:30 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Datos del equipo: $6.000 por ciclo de lavadora y $6.000 por ciclo de secadora, cobro por uso; deja más o menos $1.000.000 al mes en una propiedad de 25 habitaciones donde no todos lavan. Cambié 'No se trata solo de arrendar, se trata de multiplicar...' (estructura de plantilla).", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "La zona de lavado de un coliving puede dejar cerca de 1 millón de pesos al mes.\n\nLavadora a $6.000 por ciclo y secadora a $6.000, cobradas por uso. En una propiedad de 25 habitaciones, y sin que todos laven, eso deja más o menos 1 millón mensual.\n\nLas habitaciones son el ingreso principal, pero no el único.\n\nSi quieres que seamos tus mentores en este camino de construir patrimonio, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#ColivingColombia", "#Multirrenta", "#InversionInmobiliaria"]}, {"numero": "Guión 06 · R015", "titulo": "No hagás lo que te apasiona… al principio", "bloque": "🔥 Opinión", "tipo": "#22 Refrán al revés", "palanca": "Contrario a 'haz lo que te apasiona'", "duracion": "~43 seg", "guion": [{"parte": "Gancho", "timing": "~3 seg", "clase": "gancho", "texto": "No hagás lo que te apasiona. Al menos no al principio."}, {"parte": "Relevancia", "timing": "~9 seg", "clase": "relevancia", "texto": "Si seguís esperando encontrar tu pasión para arrancar, no vas a lograr nada.\nSuena duro, pero es así.\nPara ver resultados, te tenés que enamorar de procesos que no son fáciles."}, {"parte": "Valor", "timing": "~25 seg", "clase": "valor", "texto": "Yo encontré una oportunidad en los bienes raíces.\nMe gustaba la idea de construir edificios y que fueran rentables.\n¿Pero trasnochar haciendo números, armando propuestas, visitando obras?\nEso no era fácil. Y todavía hay cosas que me cuestan.\nLo que me apasiona es lo que viene después.\nGente que no tiene mucha plata, viviendo en un lugar digno que puede pagar.\nMi familia sin preocupaciones de plata.\nEl equipo celebrando los resultados.\nAsí que no hagás lo que te apasiona, al menos no al principio.\nEnamorate del proceso."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "Regrabación del reel 015 (11.497 vistas). ~43 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 3.1 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Honesto y personal; bajar el tono en la parte de la familia y el equipo.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Mano al pecho en 'lo que me apasiona'.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Tarjetas: 0:00 NO HAGAS LO QUE TE APASIONA · 0:08 ENAMÓRATE DEL PROCESO · 0:17 NÚMEROS · PROPUESTAS · OBRAS · 0:23 LO QUE VIENE DESPUÉS · 0:37 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Regrabación del reel 015, el de más vistas de los cinco (11.497). El original estaba en usted ('Vea, no haga lo que le apasiona'), espontáneo. Lo pasé a vos, como habla Camilo con guion. Si prefiere el tono del original, el hook en usted está en la tabla (51 OK). Cierra en loop con el hook antes del CTA, como el original. El calificador le da 52 al hook porque no tiene números: es una opinión, y en este tipo de reel el puntaje subestima. El original funcionó.", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "No hagas lo que te apasiona, al menos no al principio.\n\nPara ver resultados hay que enamorarse de procesos que no son fáciles: trasnochar con números, armar propuestas, visitar obras.\n\nLa pasión llega con lo que viene después: gente viviendo en un lugar digno que puede pagar, la familia tranquila, el equipo celebrando resultados.\n\nSi quieres que seamos tus mentores en este camino de construir patrimonio, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#InversionInmobiliaria", "#MentalidadInversionista", "#BienesRaicesColombia"]}, {"numero": "Guión 07 · V1", "titulo": "La cuenta antes de firmar una casa en rent to rent", "bloque": "🧠 Educativo", "tipo": "#6 Cifra promedio", "palanca": "Misma casa, 2,7 veces más ingreso", "duracion": "~41 seg", "guion": [{"parte": "Gancho", "timing": "~4 seg", "clase": "gancho", "texto": "Pagás cuatro millones de arriendo y la casa te deja diez coma ocho."}, {"parte": "Relevancia", "timing": "~9 seg", "clase": "relevancia", "texto": "Son números promedio de nuestros proyectos en rent to rent.\nY esta es la cuenta que hacemos antes de firmar cualquier casa.\nArrendás la casa entera al dueño por cuatro millones al mes."}, {"parte": "Valor", "timing": "~22 seg", "clase": "valor", "texto": "La adecuás por habitaciones y en coliving genera diez coma ocho.\nAhora dividí: diez coma ocho entre cuatro da dos coma siete.\nNuestra métrica dorada pide mínimo dos coma cinco.\nEsta casa pasa.\n¿Por qué dos coma cinco?\nPorque con ese margen pagás el arriendo, los servicios y la operación,\ny te queda aire por si se desocupa alguna habitación.\nSi una casa no llega a dos coma cinco,\nno se firma, por bonita que sea."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "~41 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 3.7 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Didáctico y tranquilo; la cuenta es la protagonista.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Mostrar la división 4 ÷ 10,8 con las manos o en una hoja.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Tarjetas: 0:00 4M → 10,8M · 0:04 PROMEDIO DE NUESTROS PROYECTOS · 0:10 ARRIENDO: 4 MILLONES · 0:13 COLIVING: 10,8 MILLONES · 0:16 10,8 ÷ 4 = 2,7 · 0:19 MÍNIMO 2,5 · 0:22 PASA · 0:30 SI NO DA, NO SE FIRMA · 0:35 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Reescrito desde cero para que tenga una sola línea: la cuenta que se hace antes de firmar una casa en rent to rent. Las cifras (4 y 10,8 millones) se presentan como promedio de sus proyectos, como pide la regla. Usa la métrica en su forma más simple (veces el arriendo, mínimo 2,5) en vez del 40%, que confundía. Confirmado por el equipo: el margen de 2,5 cubre arriendo, servicios y operación.", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "Antes de firmar una casa en rent to rent hacemos una sola cuenta.\n\nCon números promedio de nuestros proyectos: arriendo de 4 millones al dueño, 10,8 millones al mes en coliving. 10,8 entre 4 da 2,7.\n\nNuestra métrica dorada pide mínimo 2,5: con ese margen se paga el arriendo, los servicios y la operación, y queda aire si se desocupa una habitación. Si no llega a 2,5, no se firma.\n\nSi quieres que seamos tus mentores en este camino de construir patrimonio, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#RentToRent", "#ColivingColombia", "#MetricaDorada"]}, {"numero": "Guión 08 · R014", "titulo": "Siete proyectos sin decir “voy a intentar”", "bloque": "🔥 Mentalidad", "tipo": "#8 Desde adentro", "palanca": "'Voy a hacer' en vez de 'voy a intentar'", "duracion": "~37 seg", "guion": [{"parte": "Gancho", "timing": "~6 seg", "clase": "gancho", "texto": "Saqué siete proyectos adelante sin decir nunca \"voy a intentar\".\nMucha gente nos dice: \"no me alcanza, pero voy a intentar\"."}, {"parte": "Relevancia", "timing": "~7 seg", "clase": "relevancia", "texto": "Y el que intenta, a la primera dificultad, para.\nMi primer edificio no arrancó con \"voy a intentar hacer un edificio\".\nArrancó con una meta exacta:"}, {"parte": "Valor", "timing": "~18 seg", "clase": "valor", "texto": "quince apartaestudios, rentando uno coma seis por ciento al mes.\nCon esa meta clara supe qué tipo de lote buscar,\ncuánta plata necesitaba y cómo la iba a conseguir.\nAhí está la diferencia.\n\"Voy a intentar\" no te dice qué hacer mañana. Una meta con número sí.\nEntonces escribí la tuya:\nqué vas a hacer, cuánto te va a rentar y para cuándo."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "Regrabación del reel 014 (9.309 vistas). ~37 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 2.9 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Seguro, sin sonar a gurú; es lo que él hizo.", a": "Responde la crítica de 'vende cursos'", "duracion": "~43 seg", "guion": [{"parte": "Gancho", "timing": "~5 seg", "clase": "gancho", "texto": "¿Que por qué vendo cursos? Te lo explico una sola vez.\nLos bienes raíces me dieron la libertad financiera"}, {"parte": "Relevancia", "timing": "~10 seg", "clase": "relevancia", "texto": "para hacer lo que más me gusta: enseñar.\nMucha gente le tiene miedo a invertir por los cuentos que hay.\nQue toca arrancar con mucha plata, que es muy complicado, que hay muchas estafas."}, {"parte": "Valor", "timing": "~23 seg", "clase": "valor", "texto": "Y ojo: yo empecé a enseñar cuando ya tenía resultados.\nNo nací en cuna de oro, ni era experto cuando arranqué.\nY obvio que tenía miedo.\nPero cuando empecé a vivir de las rentas de mis propiedades,\nentendí que si me funcionaba a mí, le podía funcionar a cualquiera.\nPor eso creé la academia Conquista Tu Patrimonio.\nPorque creo que en la cima cabemos todos.\nY al que critica, tranquilo: no todo el mundo quiere invertir en su educación."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "Regrabación del reel 016 (10.324 vistas). ~43 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 3.1 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Arranca con fastidio leve y termina convencido, nunca agresivo.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Encogerse de hombros en el hook; mirada directa en 'en la cima cabemos todos'.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Tarjetas: 0:00 ¿POR QUÉ VENDO CURSOS? · 0:11 MUCHA PLATA · ESTAFAS · 0:15 PRIMERO LOS RESULTADOS · 0:29 ACADEMIA CONQUISTA TU PATRIMONIO · 0:38 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Regrabación del reel 016. Conserva el arranque de responder una crítica, que es lo que lo hizo funcionar. Suavicé el cierre del original ('entiendo que sea un perezoso'): insultar al que critica le da alcance al hater y puede espantar a un comprador. En el original tuvo pocos compartidos (7): sirve más como fijado de presentación en el perfil que para ganar alcance. El calificador le da 47 al hook: no tiene números ni palabras de tensión. En este formato (objeción respondida) el puntaje subestima; el original funcionó.", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "¿Por qué enseñamos bienes raíces?\n\nPorque mucha gente no invierte por miedo a los cuentos: que toca empezar con mucha plata, que es complicado, que hay muchas estafas.\n\nCamilo empezó a enseñar cuando ya vivía de las rentas de sus propiedades. Si le funcionó a él, le puede funcionar a cualquiera que lo haga bien. Por eso existe la academia Conquista Tu Patrimonio.\n\nSi quieres que seamos tus mentores en este camino de construir patrimonio, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#ConquistaTuPatrimonio", "#InversionInmobiliaria", "#BienesRaicesColombia"]}, {"numero": "Guión 11 · V9", "titulo": "El crédito hipotecario, para construir activos", "bloque": "🧠 Educativo", "tipo": "#26 Superlativo", "palanca": "Perderle el miedo al crédito", "duracion": "~45 seg", "guion": [{"parte": "Gancho", "timing": "~5 seg", "clase": "gancho", "texto": "El crédito hipotecario no es para comprar la casa donde vas a vivir.\nBueno, para nosotros no."}, {"parte": "Relevancia", "timing": "~7 seg", "clase": "relevancia", "texto": "Es el crédito más beneficioso que hay en Colombia.\nTasas más bajas y plazos largos.\nY nosotros lo usamos para comprar activos que se pagan solos."}, {"parte": "Valor", "timing": "~27 seg", "clase": "valor", "texto": "Así funciona en Flipping dos punto cero.\nComprás la casa con crédito hipotecario.\nLa remodelás con tu capital y la convertís en multirrenta.\nY las rentas pagan la cuota, no tu sueldo.\nOjo: el banco no financia cualquier cosa.\nFinancia lo que está bien estructurado:\npapeles en regla y condiciones legales y estructurales.\nY antes de pedir el crédito, la cuenta:\nel flujo neto tiene que llegar\nal uno coma tres por ciento mensual de la inversión.\nCon eso, la propiedad paga la cuota y todavía deja utilidad.\nSi no da, no se compra."}, {"parte": "Acción", "timing": "~6 seg", "clase": "accion", "texto": "Si querés que seamos tus mentores en este camino de construir patrimonio,\ncomentá PATRIMONIO y te mandamos toda la información."}], "notas": [{"icon": "⚡", "titulo": "Ritmo y energía", "texto": "~45 s a unas 210 palabras por minuto (el ritmo de Camilo con guion). El hook tiene que estar dicho en 3.7 s. Cada línea del guion es un corte o un cambio de plano.", "cta": false}, {"icon": "😐", "titulo": "Expresión", "texto": "Tranquilo y confiable, de asesor, sin vender.", "cta": false}, {"icon": "🤲", "titulo": "Gestos", "texto": "Contar los tres requisitos con los dedos, en sincronía con las tarjetas.", "cta": false}, {"icon": "🎬", "titulo": "Visuales y texto en pantalla", "texto": "Tarjetas: 0:00 NO ES PARA LA CASA DONDE VIVES · 0:05 TASAS BAJAS · PLAZOS LARGOS · 0:14 COMPRA CON CRÉDITO · 0:16 REMODELACIÓN CON CAPITAL PROPIO · 0:19 LAS RENTAS PAGAN LA CUOTA · 0:31 FLUJO NETO ≥ 1,3% MENSUAL · 0:34 CUOTA PAGA + UTILIDAD · 0:39 COMENTA PATRIMONIO\n\nMáximo seis palabras por tarjeta, dentro de la zona segura (ni arriba de y=230 ni abajo de y=1440, libres los 230 px de la derecha). Subtítulos quemados.\n\nNotas: Reescrito para alinearlo con la metodología: el crédito hipotecario como herramienta para comprar activos en Flipping 2.0, no para comprar vivienda propia. Confirmado por el equipo: usan crédito hipotecario, el banco financia solo la compra (la remodelación va con capital propio) y con un flujo neto de al menos 1,3% mensual la propiedad paga la cuota y deja utilidad. Por pedido del equipo, el guion NO menciona cómo se presenta la propiedad ante el banco (vivienda unifamiliar). Saqué esa parte. Usa la métrica dorada de Flipping 2.0 (1,3% mensual de la inversión total). No hay un número exacto de cuánto deja después de la cuota; por eso el guion dice 'paga la cuota y deja utilidad' sin cifra.", "cta": false}, {"icon": "🎵", "titulo": "Audio", "texto": "Voz a cámara, limpia. Si hay música, de fondo, baja y sin letra para que no tape la voz. Casi todos miran sin sonido primero: los subtítulos cargan el video.", "cta": false}, {"icon": "📢", "titulo": "CTA", "texto": "Decirlo a cámara, sin apuro: \"Si querés que seamos tus mentores en este camino de construir patrimonio, comentá PATRIMONIO y te mandamos toda la información.\" La tarjeta COMENTA PATRIMONIO queda en pantalla hasta el final. El comentario dispara el DM con la información y el paso a WhatsApp con el setter para agendar la llamada.", "cta": true}], "descripcion": "El crédito hipotecario no es solo para la casa donde vives.\n\nBien usado, es la herramienta para comprar activos que se pagan solos.\n\nEn Flipping 2.0: compras con crédito hipotecario, remodelas con tu capital, conviertes en multirrenta y las rentas pagan la cuota.\n\nAntes de pedir el crédito, la cuenta: el flujo neto tiene que llegar al menos al 1,3% mensual de la inversión. Así la propiedad paga la cuota y deja utilidad.\n\nSi quieres que seamos tus mentores en este camino de construir patrimonio, comenta PATRIMONIO y te enviamos toda la información.", "hashtags": ["#CreditoHipotecario", "#Flipping20", "#InversionInmobiliaria"]}];
let current = 0;
let currentTab = 'guion';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LABELS = {si:'Sí', no:'No', rev:'Revisar'};
let decisions = {};
try { decisions = JSON.parse(localStorage.getItem('ctp-decisiones') || '{}') || {}; } catch (e) { decisions = {}; }
const keyOf = r => r.numero.split('·').pop().trim();
function saveDecisions(){ try { localStorage.setItem('ctp-decisiones', JSON.stringify(decisions)); } catch (e) {} }
function decide(v){
  const k = keyOf(reels[current]);
  if (decisions[k] === v) delete decisions[k]; else decisions[k] = v;
  saveDecisions(); renderDecide(); renderSummary();
}
function renderDecide(){
  const d = decisions[keyOf(reels[current])];
  document.getElementById('decide').innerHTML = '<span class="decide-label">Decisión</span>' +
    ['si','rev','no'].map(v => `<button class="dec-btn ${v}${d === v ? ' on' : ''}" onclick="decide('${v}')">${LABELS[v]}</button>`).join('');
}
function renderSummary(){
  const c = {si:0, no:0, rev:0, none:0};
  document.getElementById('sumBody').innerHTML = reels.map((r, i) => {
    const d = decisions[keyOf(r)] || 'none'; c[d]++;
    return `<tr onclick="goTo(${i}); toggleSummary(false)"><td>${esc(keyOf(r))}</td><td>${esc(r.titulo)}</td><td class="hide-m">${esc(r.bloque)}</td><td class="hide-m">${esc(r.duracion)}</td><td><span class="pill ${d}">${d === 'none' ? 'Sin decidir' : LABELS[d]}</span></td></tr>`;
  }).join('');
  document.getElementById('sumCounts').textContent = `${c.si} sí · ${c.rev} por revisar · ${c.no} no · ${c.none} sin decidir`;
}
function toggleSummary(force){
  const el = document.getElementById('summary');
  const show = typeof force === 'boolean' ? force : !el.classList.contains('active');
  el.classList.toggle('active', show);
  document.getElementById('detail').style.display = show ? 'none' : '';
  document.getElementById('sumBtn').textContent = show ? 'Ver guiones' : 'Resumen';
  if (show) renderSummary();
  window.scrollTo({top:0});
}
function copyDecisions(btn){
  const lines = reels.map(r => { const d = decisions[keyOf(r)]; return `${keyOf(r)} · ${r.titulo}: ${d ? LABELS[d] : 'sin decidir'}`; });
  const text = lines.join('\n');
  const done = () => { btn.textContent = '✓ Copiado'; setTimeout(() => btn.textContent = 'Copiar decisiones', 2000); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done); }
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}
function animate(el){ el.style.animation='none'; void el.offsetWidth; el.style.animation='fadeUp 0.4s ease forwards'; }
function render(){
  const r = reels[current];
  document.getElementById('cur').textContent = current + 1;
  document.getElementById('tot').textContent = reels.length;
  document.getElementById('prog').style.width = ((current + 1) / reels.length * 100) + '%';
  const meta = document.getElementById('meta');
  meta.innerHTML = `<div class="reel-num">${esc(r.numero)}</div><h1 class="reel-title">${esc(r.titulo)}</h1>
    <div class="tags"><span class="tag tag-bloque">${esc(r.bloque)}</span><span class="tag tag-tipo">${esc(r.tipo)}</span><span class="tag tag-palanca">${esc(r.palanca)}</span><span class="tag tag-duracion">${esc(r.duracion)}</span></div>`;
  animate(meta);
  document.getElementById('p-guion').innerHTML = r.guion.map(p => `<div class="block"><div class="block-label label-${p.clase}">${esc(p.parte)} <span>${esc(p.timing)}</span></div><div class="script-text ${p.clase}">${esc(p.texto)}</div></div>`).join('');
  document.getElementById('p-notas').innerHTML = `<div class="notes-grid">${r.notas.map(n => `<div class="note${n.cta ? ' cta-note' : ''}"><div class="note-title">${n.icon} ${esc(n.titulo)}</div><div class="note-text">${esc(n.texto)}</div></div>`).join('')}</div>`;
  document.getElementById('p-desc').innerHTML = `<div class="desc-box"><button class="desc-copy-btn" onclick="copyDesc(this)">Copiar</button><div class="desc-text">${esc(r.descripcion)}</div><div class="hashtags">${r.hashtags.map(h => `<span class="hashtag">${esc(h)}</span>`).join('')}</div></div>`;
  ['p-guion','p-notas','p-desc'].forEach(id => animate(document.getElementById(id)));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').textContent = current === reels.length - 1 ? '✓ Fin' : 'Siguiente →';
  document.getElementById('next').disabled = current === reels.length - 1;
  document.getElementById('dots').innerHTML = reels.map((_, i) => `<div class="dot${i === current ? ' active' : ''}" onclick="goTo(${i})" title="${esc(reels[i].titulo)}"></div>`).join('');
  switchTab(currentTab);
  renderDecide();
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + tab));
}
function navigate(dir){ const n = current + dir; if (n < 0 || n >= reels.length) return; current = n; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function goTo(i){ current = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function copyDesc(btn){
  const r = reels[current];
  const text = r.descripcion + '\n\n' + r.hashtags.join(' ');
  const done = () => { btn.textContent = '✓ Copiado'; setTimeout(() => btn.textContent = 'Copiar', 2000); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done); }
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}
render();
</script>
</body>
</html>
