<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guiones CTP · @elpingo_83</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --navy: #0F2544;
    --navy-light: #1a3560;
    --navy-dark: #091a33;
    --lime: #00C96E;
    --lime-dim: #00a85c;
    --lime-soft: rgba(0,201,110,0.12);
    --lime-softer: rgba(0,201,110,0.06);
    --white: #ffffff;
    --off-white: #f0f4f8;
    --text-primary: #e8edf4;
    --text-secondary: #8fa3bf;
    --text-muted: #5a7494;
    --border: rgba(255,255,255,0.08);
    --border-lime: rgba(0,201,110,0.3);
    --card-bg: rgba(255,255,255,0.04);
    --card-hover: rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--navy-dark);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* — Header — */
  .header {
    background: var(--navy);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    background: var(--lime);
    border-radius: 50%;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .brand-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--white);
  }

  .brand-handle {
    font-size: 12px;
    color: var(--lime);
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .counter {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .counter span {
    color: var(--lime);
    font-weight: 600;
  }

  /* — Progress bar — */
  .progress-bar {
    height: 2px;
    background: var(--border);
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--lime);
    transition: width 0.4s ease;
  }

  /* — Main layout — */
  .main {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* — Reel meta — */
  .reel-meta {
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.4s ease forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .reel-number {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 10px;
  }

  .reel-title {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--white);
    margin-bottom: 14px;
  }

  .reel-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }

  .tag-bloque { background: rgba(127,119,221,0.15); color: #a8a1f0; border: 1px solid rgba(127,119,221,0.25); }
  .tag-tipo { background: var(--lime-softer); color: var(--lime); border: 1px solid var(--border-lime); }
  .tag-palanca { background: rgba(255,255,255,0.06); color: var(--text-secondary); border: 1px solid var(--border); }
  .tag-duracion { background: rgba(255,255,255,0.06); color: var(--text-secondary); border: 1px solid var(--border); }

  /* — Tabs — */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  .tab {
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.2s, border-color 0.2s;
    user-select: none;
  }

  .tab:hover { color: var(--text-secondary); }
  .tab.active { color: var(--lime); border-bottom-color: var(--lime); }

  /* — Tab content — */
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeUp 0.3s ease forwards; }

  /* — Guion — */
  .guion-block {
    margin-bottom: 16px;
  }

  .block-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .block-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .label-gancho { color: #a8a1f0; }
  .label-relevancia { color: var(--lime); }
  .label-valor { color: #f0b429; }
  .label-accion { color: #f08070; }

  .block-timing {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    margin-left: 4px;
  }

  .script-text {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 18px 20px;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-primary);
    white-space: pre-wrap;
    border-left: 3px solid;
  }

  .script-text.gancho { border-color: #7F77DD; }
  .script-text.relevancia { border-color: var(--lime); }
  .script-text.valor { border-color: #f0b429; }
  .script-text.accion { border-color: #f08070; }

  /* — Notas — */
  .notes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .note-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: background 0.2s;
  }

  .note-card:hover { background: var(--card-hover); }

  .note-icon {
    font-size: 16px;
    margin-bottom: 8px;
  }

  .note-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .note-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .cta-note {
    grid-column: 1 / -1;
    background: var(--lime-softer);
    border-color: var(--border-lime);
  }

  /* — Descripción — */
  .desc-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-primary);
    white-space: pre-wrap;
    position: relative;
  }

  .desc-copy-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--lime-soft);
    border: 1px solid var(--border-lime);
    color: var(--lime);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .desc-copy-btn:hover { background: rgba(0,201,110,0.2); }

  .hashtags {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .hashtag {
    font-size: 12px;
    color: var(--lime);
    background: var(--lime-softer);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border-lime);
  }

  /* — Navigation — */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 48px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--card-hover);
    color: var(--white);
    border-color: rgba(255,255,255,0.15);
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .nav-btn.next {
    background: var(--lime);
    border-color: var(--lime);
    color: var(--navy-dark);
    font-weight: 600;
  }

  .nav-btn.next:hover:not(:disabled) {
    background: var(--lime-dim);
    border-color: var(--lime-dim);
    color: var(--navy-dark);
  }

  /* — Dot nav — */
  .dot-nav {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .dot.active {
    background: var(--lime);
    width: 20px;
    border-radius: 3px;
  }

  /* — Responsive — */
  @media (max-width: 600px) {
    .header { padding: 16px 20px; }
    .main { padding: 28px 16px 60px; }
    .reel-title { font-size: 20px; }
    .notes-grid { grid-template-columns: 1fr; }
    .cta-note { grid-column: 1; }
    .tab { padding: 10px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-dot"></div>
    <div>
      <div class="brand-name">Conquista Tu Patrimonio</div>
      <div class="brand-handle">@elpingo_83</div>
    </div>
  </div>
  <div class="counter">Guión <span id="current-num">1</span> de <span id="total-num">7</span></div>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progress-fill"></div>
</div>

<div class="main">
  <div class="reel-meta" id="reel-meta"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('guion')">Guión</div>
    <div class="tab" onclick="switchTab('notas')">Notas de grabación</div>
    <div class="tab" onclick="switchTab('descripcion')">Descripción del post</div>
  </div>

  <div class="tab-content active" id="tab-guion"></div>
  <div class="tab-content" id="tab-notas"></div>

  <div class="nav">
    <button class="nav-btn prev" id="btn-prev" onclick="navigate(-1)">← Anterior</button>
    <div class="dot-nav" id="dot-nav"></div>
    <button class="nav-btn next" id="btn-next" onclick="navigate(1)">Siguiente →</button>
  </div>
</div>

<script>
const reels = [
  {
    numero: "Guión 01",
    titulo: "El dinero no es el problema",
    bloque: "🧠 Educativo",
    tipo: "Tumba-Mitos · #1",
    palanca: "Negación contraintuitiva",
    duracion: "45–55 seg",
    guion: [
      {
        parte: "Gancho",
        timing: "~7 seg",
        clase: "gancho",
        texto: `"La mayoría cree que no puede invertir en bienes raíces porque no tiene dinero.\n\nEse no es el problema real — y te voy a demostrar por qué."`
      },
      {
        parte: "Relevancia",
        timing: "~12 seg",
        clase: "relevancia",
        texto: `"Llevo más de 10 años en esto y las 175 puertas que tenemos encima me lo confirman: el 90% de las personas que no avanzaron, no frenaron por falta de capital.\n\nFrenaron porque no sabían qué hacer con el capital que ya tenían."`
      },
      {
        parte: "Valor",
        timing: "~25 seg",
        clase: "valor",
        texto: `"En CTP trabajamos dos modelos que lo demuestran.\n\nCon Rent to Rent, no necesitás ser dueño de nada. Tomás una propiedad en arriendo, la adecuás, la convertís en coliving y la diferencia entre lo que pagás y lo que cobrás por habitación es tu flujo mensual. Capital propio: mínimo.\n\nCon Flipping 2.0, comprás, reformás y convertís en coliving para arrendar. Acá sí necesitás capital — pero el sistema te enseña a conseguirlo: banco, socios, inversionistas. Eso también se aprende.\n\nEl denominador común de los dos no es el dinero. Es saber exactamente qué hacer con una propiedad para que genere flujo."`
      },
      {
        parte: "Acción",
        timing: "~8 seg",
        clase: "accion",
        texto: `"Si estás esperando tener más plata para aprender, ese es exactamente el ciclo que te tiene frenado.\n\nSeguime — esto es lo que enseño todo el tiempo."`
      }
    ],
    notas: [
      { icon: "⚡", titulo: "Ritmo y energía", texto: "Gancho: directo, sin intro. Cara a cámara, pausa corta después de \"el problema real\". El bloque de valor puede bajar el ritmo — es didáctico, no urgente." },
      { icon: "😐", titulo: "Expresión", texto: "Al inicio: confianza tranquila, no agresiva. En el bloque de valor: tono de quien está compartiendo algo que ya probó, no vendiendo. Al cierre: directo, sin urgencia artificial." },
      { icon: "🤲", titulo: "Gestos", texto: "Levantar mano al decir \"capital propio: mínimo\" para enfatizar. Enumerar con dedos los dos modelos. En el cierre, señalar a cámara al decir \"ese ciclo que te tiene frenado\"." },
      { icon: "🎬", titulo: "Visuales sugeridos", texto: "Texto en pantalla al inicio: \"El problema no es el dinero\". Al mencionar los dos modelos: texto sobreimpreso \"Rent to Rent\" y \"Flipping 2.0\". Si tenés b-roll de algún proyecto activo, cortá ahí en el bloque de valor." },
      { icon: "🎵", titulo: "Audio", texto: "Música de fondo baja, neutra, sin drama. Este reel vive en la autoridad del mensaje — la música no tiene que hacer el trabajo." },
      { icon: "📢", titulo: "CTA", texto: "Seguir la cuenta. Orgánico. Para pauta: reemplazá por WhatsApp o DM directo.", cta: true }
    ],
    descripcion: `El dinero no es lo que te frena. Es no saber qué hacer con él. 💡\n\nCon más de 175 puertas encima, lo que veo repetirse es siempre lo mismo: la persona tenía acceso al capital — no tenía el sistema.\n\nDos modelos que lo prueban:\n\n→ Rent to Rent: sin ser dueño, convertís una propiedad en coliving y generás flujo mensual desde el primer mes.\n→ Flipping 2.0: comprás, reformás y convertís — el capital se consigue, eso también es parte del aprendizaje.\n\nEl denominador común no es el dinero. Es el conocimiento.\n\nSeguime 👆 — publico esto todo el tiempo.`,
    hashtags: ["#ConquistaTuPatrimonio", "#InversionInmobiliaria", "#FincaRaiz", "#Coliving", "#RentToRent"]
  },
  {
    numero: "Guión 02",
    titulo: "Los bienes raíces no son solo comprar y esperar",
    bloque: "🧠 Educativo",
    tipo: "Tumba-Mitos · #1",
    palanca: "Negación contraintuitiva",
    duracion: "45–55 seg",
    guion: [
      {
        parte: "Gancho",
        timing: "~7 seg",
        clase: "gancho",
        texto: `"Si creés que invertir en bienes raíces es comprar, arrendar y esperar a que se valorice, te están enseñando el modelo más lento y menos rentable que existe."`
      },
      {
        parte: "Relevancia",
        timing: "~12 seg",
        clase: "relevancia",
        texto: `"Ese modelo funciona — nadie te está mintiendo. Pero te exige capital alto, paciencia de años y te pone a depender de algo que no controlás: el mercado.\n\nHay personas esperando valorización hace una década con propiedades que no les generan ni lo que necesitan para vivir."`
      },
      {
        parte: "Valor",
        timing: "~25 seg",
        clase: "valor",
        texto: `"El modelo que nosotros enseñamos en CTP no espera valorización. Genera flujo desde el primer mes.\n\nLa lógica es simple: una propiedad convencional arrendada de manera tradicional genera un flujo. Esa misma propiedad convertida en coliving — con habitaciones independientes, zonas comunes bien adecuadas y un perfil de inquilino específico — puede multiplicar ese flujo varias veces.\n\nNo estás especulando con el futuro. Estás activando el presente.\n\nY lo mejor: no necesitás ser dueño para aplicarlo. Con Rent to Rent arrancás sin comprar nada. Con Flipping 2.0 comprás, adecuás y el flujo del coliving te paga la inversión."`
      },
      {
        parte: "Acción",
        timing: "~8 seg",
        clase: "accion",
        texto: `"Si esto te abrió una perspectiva nueva sobre cómo funciona la finca raíz, seguime — esto es lo que enseño todo el tiempo."`
      }
    ],
    notas: [
      { icon: "⚡", titulo: "Ritmo y energía", texto: "Gancho con convicción firme, no con tono de ataque. En la relevancia: bajar levemente el ritmo, dejar que la imagen de \"esperar una década\" aterrice. En el valor: recuperar energía al presentar el modelo CTP." },
      { icon: "😐", titulo: "Expresión", texto: "No es un reel de crítica al modelo tradicional — es un reel de apertura de posibilidad. La expresión en el gancho es de quien sabe algo que el otro todavía no. En el valor: entusiasmo genuino, no exagerado." },
      { icon: "🤲", titulo: "Gestos", texto: "Al decir \"esperar valorización\": gesto de espera con las manos, como mirando un reloj. Al decir \"genera flujo desde el primer mes\": gesto de activación, mano abierta hacia adelante. Al mencionar Rent to Rent y Flipping 2.0: enumerar con dedos." },
      { icon: "🎬", titulo: "Visuales sugeridos", texto: "Texto en pantalla sobre el gancho: \"Comprar y esperar = el modelo más lento\". Al introducir coliving: cortar a b-roll de un proyecto real si tenés. Al mencionar los dos modelos: texto sobreimpreso \"Rent to Rent\" / \"Flipping 2.0\"." },
      { icon: "🎵", titulo: "Audio", texto: "Música que empiece contenida y suba levemente al entrar al bloque de valor — refuerza el reencuadre. Que no tape la voz en ningún momento." },
      { icon: "📢", titulo: "CTA", texto: "Seguir la cuenta. Orgánico. Para pauta: reemplazá por WhatsApp o DM directo.", cta: true }
    ],
    descripcion: `Comprar y esperar valorización no es invertir. Es apostar. 🎲\n\nEl modelo tradicional funciona — pero te exige capital alto, años de paciencia y depender de un mercado que no controlás.\n\nEl modelo de multirrentas funciona diferente:\n\n→ No esperás que suba el precio. Generás flujo desde el primer mes.\n→ La misma propiedad, convertida en coliving, puede multiplicar su rentabilidad varias veces.\n→ No necesitás ser dueño para arrancar — con Rent to Rent empezás sin comprar nada.\n\nNo es especulación. Es activación.\n\nSeguime 👆 — publico esto todo el tiempo.`,
    hashtags: ["#ConquistaTuPatrimonio", "#InversionInmobiliaria", "#FincaRaiz", "#Coliving", "#Multirrentas"]
  },
  {
    numero: "Guión 03",
    titulo: "Inversor pasivo vs. inversor activo",
    bloque: "🧠 Educativo",
    tipo: "Comparativa · #3",
    palanca: "Contraste agudo",
    duracion: "45–55 seg",
    guion: [
      {
        parte: "Gancho",
        timing: "~7 seg",
        clase: "gancho",
        texto: `"Hay dos tipos de personas que quieren invertir en bienes raíces. Las que esperan tener el dinero para aprender. Y las que aprenden primero y consiguen el dinero después.\n\n¿Cuál sos vos?"`
      },
      {
        parte: "Relevancia",
        timing: "~12 seg",
        clase: "relevancia",
        texto: `"El primero lleva años diciéndose lo mismo: 'cuando junte más capital, arranco'. El problema es que sin el sistema, el capital que junta no le alcanza nunca — porque no sabe qué hacer con él.\n\nEl segundo entiende algo que cambia todo: el dinero sigue al conocimiento, no al revés."`
      },
      {
        parte: "Valor",
        timing: "~25 seg",
        clase: "valor",
        texto: `"En más de 10 años trabajando en esto, con 175 puertas encima, nunca vi a alguien frenar por falta de capital cuando ya tenía claro el modelo.\n\nLo que veo es esto: el que aprende primero identifica la propiedad correcta, sabe cómo presentar el proyecto, sabe a qué banco ir y con qué números, sabe cómo hablarle a un socio o a un inversionista. El capital aparece porque el modelo es sólido.\n\nEl que espera juntar primero llega con plata pero sin criterio. Compra mal, reforma mal, y termina con una propiedad que no genera lo que necesita.\n\nEl conocimiento no es el premio al final del camino. Es lo primero que conseguís."`
      },
      {
        parte: "Acción",
        timing: "~6 seg",
        clase: "accion",
        texto: `"Si querés ser del segundo grupo, empezá por acá. Seguime — esto es lo que enseño todo el tiempo."`
      }
    ],
    notas: [
      { icon: "⚡", titulo: "Ritmo y energía", texto: "Gancho pausado — dejá que la pregunta \"¿cuál sos vos?\" aterrice antes de seguir. Relevancia: tono de diagnóstico, no de juicio. Valor: más energía, es el momento donde el modelo se muestra claro. Cierre: directo y breve." },
      { icon: "😐", titulo: "Expresión", texto: "Al describir al que espera: expresión de comprensión, no de burla — la audiencia se puede identificar con ese perfil. Al describir al que aprende primero: convicción genuina. En el cierre: invitación, no presión." },

  // Reset tabs
  switchTab(currentTab, false);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchTab(tab, scroll) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['guion', 'notas', 'descripcion'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

function navigate(dir) {
  current = Math.max(0, Math.min(reels.length - 1, current + dir));
  render();
}

function goTo(i) {
  current = i;
  render();
}

function copyDesc() {
  const r = reels[current];
  const full = r.descripcion + '\n\n' + r.hashtags.join(' ');
  navigator.clipboard.writeText(full).then(() => {
    const btn = document.querySelector('.desc-copy-btn');
    btn.textContent = '✓ Copiado';
    setTimeout(() => btn.textContent = 'Copiar', 2000);
  });
}

render();
</script>
</body>
</html>
